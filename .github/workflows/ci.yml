name: CI

on:
  pull_request:
  # deploy.yml runs this first and only deploys when it passes
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      # The client's env schema is checked at runtime, not in CI
      SKIP_ENV_VALIDATION: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is gitignored; typecheck and build need it
      - run: pnpm --filter @repo/backend db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build --filter=@repo/client --filter=@repo/backend
