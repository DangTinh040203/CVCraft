name: CI

on:
  pull_request:
  # deploy.yml runs this first and only deploys when it passes
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      # The client's env schema is checked at runtime, not in CI
      SKIP_ENV_VALIDATION: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is gitignored; typecheck and build need it
      - run: pnpm --filter @repo/backend db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Prerendering the auth pages needs the client's NEXT_PUBLIC_* (the
      # Clerk key above all). Same list as the build args in deploy.yml.
      # Secrets aren't passed to PRs from forks, so those fail here.
      - name: Load client build env
        env:
          FE_ENV: ${{ secrets.FE_ENV_PRODUCTION }}
        run: |
          if [ -z "$FE_ENV" ]; then
            echo '::error::FE_ENV_PRODUCTION secret is not available'
            exit 1
          fi
          printf '%s\n' "$FE_ENV" | tr -d '\r' | grep -E '^NEXT_PUBLIC_(API_URL|SITE_URL|CLERK_PUBLISHABLE_KEY|CLERK_SIGN_IN_URL|REDIRECT_URL)=' | sed -E 's/="?([^"]*)"?$/=\1/' >> "$GITHUB_ENV"

      - run: pnpm build --filter=@repo/client --filter=@repo/backend
