name: craftcv-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: cc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: craftcv_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cc_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cc_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Public tunnel to the backend running on the host, for Clerk webhooks.
  # Opt-in: `pnpm dev:tunnel`. Inspector: http://localhost:4040
  # Image is pulled by `pnpm dev:setup`. Set NGROK_AUTHTOKEN in docker/.env.
  ngrok:
    image: ngrok/ngrok:alpine
    container_name: cc_ngrok
    restart: unless-stopped
    profiles: ['tunnel']
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command:
      - http
      - host.docker.internal:${NGROK_PORT:-8000}
      - --url=${NGROK_DOMAIN:-melynda-unfaltering-expatiatingly.ngrok-free.dev}
      - --log=stdout
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '4040:4040'

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
